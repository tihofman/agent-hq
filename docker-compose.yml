services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  bull-board:
    image: ghcr.io/felixmosh/bull-board:latest
    profiles:
      - dev
    ports:
      - '127.0.0.1:3334:3000'
    command: ['--redis', 'redis://redis:6379', '--host', '0.0.0.0']
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
